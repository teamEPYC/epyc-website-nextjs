name: CI

on:
  pull_request:
    # `main` is the default branch and `production` is the release branch.
    # These were previously [develop, master, production] — branch names this
    # repo no longer uses — so CI never ran on a normal pull request.
    branches: [main, production]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: lib/tools/counters.test.ts runs its SQL against the
          # built-in `node:sqlite`, which does not exist before Node 22.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Typecheck contact-webhook worker
        # The consumer Worker is excluded from the root tsconfig (different
        # libs), so it has its own project — check it explicitly.
        run: pnpm exec tsc --noEmit -p workers/contact-webhook/tsconfig.json

      - name: Lint
        run: pnpm lint

      - name: OpenNext build
        run: pnpm exec opennextjs-cloudflare build
